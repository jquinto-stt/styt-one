apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: styt-one-db-pvc
  namespace: styt-one
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: styt-one-db
  namespace: styt-one
  labels:
    app: styt-one-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: styt-one-db
  template:
    metadata:
      labels:
        app: styt-one-db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: styt-one-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: styt-one-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: styt-one-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "styt_one", "-d", "styt_one"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "styt_one", "-d", "styt_one"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: styt-one-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: styt-one-db
  namespace: styt-one
spec:
  type: ClusterIP
  selector:
    app: styt-one-db
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
